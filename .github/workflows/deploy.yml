name: Frontend Deploy → Vercel

# Triggers only on push to main (production branch)
on:
  push:
    branches: [main]

jobs:
  # ── Step 1: Build validation gate ─────────────────────────────────────────
  build:
    name: Build (pre-deploy gate)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_APP_NAME: ${{ secrets.VITE_APP_NAME }}
          VITE_APP_ENV: production

      - name: Verify dist output
        run: test -d dist && test -f dist/index.html

  # ── Step 2: Deploy to Vercel (only if build passes) ───────────────────────
  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: [build]
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Pull Vercel environment info
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build with Vercel
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy to Vercel production
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

# ─────────────────────────────────────────────────────────────────────────────
# REQUIRED GitHub Secrets (add in: Settings → Secrets → Actions):
#
#   VERCEL_TOKEN       — Vercel API token (vercel.com → Settings → Tokens)
#   VERCEL_ORG_ID      — Found in vercel.json after "vercel link" or Vercel dashboard
#   VERCEL_PROJECT_ID  — Found in vercel.json after "vercel link" or Vercel dashboard
#   VITE_API_BASE_URL  — Your Railway backend URL: https://xxx.railway.app/api
#   VITE_APP_NAME      — Display name: "Your Client LMS"
# ─────────────────────────────────────────────────────────────────────────────
